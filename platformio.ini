[env:m5stickc-plus2]
platform = espressif32
board = m5stick-c-plus2
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions_buddy.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBUDDY_DUMP_RAW
    -DBOARD_HAS_PSRAM
    ; PSRAM cache coherency workaround for ESP32. The precompiled IDF
    ; libs already contain these barriers (CONFIG_SPIRAM_CACHE_WORKAROUND
    ; is enabled in arduino-esp32's sdkconfig). Match them in user code
    ; or PSRAM access across functions will race under cache invalidation.
    -mfix-esp32-psram-cache-issue
    -mfix-esp32-psram-cache-strategy=memw
build_src_filter = +<*> +<buddies/>
; ESP32 BLE Arduino (Bluedroid) is the framework-provided BLE stack; we
; swap to NimBLE because Bluedroid has a known heap-corruption issue when
; combined with PSRAM on this board/framework combo.
lib_ignore =
    DFRobot_GP8XXX
    ESP32 BLE Arduino
lib_deps =
    m5stack/M5StickCPlus2
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0
    h2zero/NimBLE-Arduino @ ^1.4.3
